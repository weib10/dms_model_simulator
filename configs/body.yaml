# Generic left-hand-drive sedan body, for the 3D layout page only (dms-sim view3d). Nothing here enters the
# simulation: model output and truth never read this file. Kept to what a target or camera sits on, plus floor,
# walls and seats for orientation. Round PLACEHOLDER numbers that fit configs/cabin.yaml (side mirrors symmetric
# about a centreline 0.36 m right of the driver) and configs/cameras.yaml (every camera on a surface below).
# Vehicle frame: X forward, Y left, Z up, metres, origin = driver eye point.
#
# Part types
#   quad:     4 corners. Seen from inside only (they face `toward`), so a view from outside looks in through
#             walls and roof.
#   box:      center, size [x, y, z], optional pitch_deg (about Y: > 0 tips the top backwards).
#   cylinder: a -> b, radius.
#   panel:    screen at a gaze target (configs/cabin.yaml targets) facing the eye point, size [w, h]; back_x: a
#             housing behind it reaching back to that x (the dash face).
#   housing:  box at a gaze target (mirror), size, optional offset; glass: mirror face colour; arm_to: held from.
# Every part has a colour (#rrggbb or a name below; optional alpha 0..1).

toward: [0.0, -0.36, -0.10]

colors:
  trim: "#8a919c"
  dash: "#4a5059"
  floor: "#6b717a"
  headliner: "#e3e5e8"
  seat: "#525a66"
  glass: "#9fc3dc"
  screen: "#0f1720"
  mirror: "#c9d6e2"

parts:
  # ---- shell: floor, roof, windshield, A-pillars, side walls (door below the beltline z -0.15, glass above) ----
  - {name: floor, type: quad, color: floor,
     points: [[-1.00, 0.50, -0.95], [1.06, 0.50, -0.95], [1.06, -1.22, -0.95], [-1.00, -1.22, -0.95]]}
  - {name: roof, type: quad, color: headliner,
     points: [[-1.00, 0.50, 0.43], [0.38, 0.50, 0.43], [0.38, -1.22, 0.43], [-1.00, -1.22, 0.43]]}
  - {name: windshield, type: quad, color: glass, alpha: 0.18,
     points: [[1.05, 0.50, -0.12], [0.38, 0.50, 0.43], [0.38, -1.22, 0.43], [1.05, -1.22, -0.12]]}
  - {name: a_pillar_left, type: quad, color: trim,
     points: [[1.06, 0.49, -0.15], [0.96, 0.49, -0.15], [0.32, 0.49, 0.43], [0.42, 0.49, 0.43]]}
  - {name: a_pillar_right, type: quad, color: trim,
     points: [[1.06, -1.21, -0.15], [0.96, -1.21, -0.15], [0.32, -1.21, 0.43], [0.42, -1.21, 0.43]]}
  - {name: door_left, type: quad, color: trim,
     points: [[-1.00, 0.50, -0.95], [1.06, 0.50, -0.95], [1.06, 0.50, -0.15], [-1.00, 0.50, -0.15]]}
  - {name: door_right, type: quad, color: trim,
     points: [[-1.00, -1.22, -0.95], [1.06, -1.22, -0.95], [1.06, -1.22, -0.15], [-1.00, -1.22, -0.15]]}
  - {name: window_left, type: quad, color: glass, alpha: 0.16,
     points: [[0.98, 0.50, -0.15], [-1.00, 0.50, -0.15], [-1.00, 0.50, 0.43], [0.38, 0.50, 0.43]]}
  - {name: window_right, type: quad, color: glass, alpha: 0.16,
     points: [[0.98, -1.22, -0.15], [-1.00, -1.22, -0.15], [-1.00, -1.22, 0.43], [0.38, -1.22, 0.43]]}
  # ---- dashboard: top (rear edge x 0.60, z -0.10), its underside over the cluster, face at x 0.74 ----
  - {name: dash_top, type: quad, color: dash,
     points: [[1.05, 0.50, -0.12], [0.60, 0.50, -0.10], [0.60, -1.22, -0.10], [1.05, -1.22, -0.12]]}
  - {name: dash_underside, type: quad, color: dash,
     points: [[0.60, 0.50, -0.10], [0.74, 0.50, -0.12], [0.74, -1.22, -0.12], [0.60, -1.22, -0.10]]}
  - {name: dash_face, type: quad, color: dash,
     points: [[0.74, 0.50, -0.12], [0.74, 0.50, -0.50], [0.74, -1.22, -0.50], [0.74, -1.22, -0.12]]}
  - {name: footwell, type: quad, color: floor,
     points: [[1.06, 0.50, -0.95], [0.74, 0.50, -0.50], [0.74, -1.22, -0.50], [1.06, -1.22, -0.95]]}
  - {name: center_stack_bezel, type: box, color: dash, center: [0.70, -0.45, -0.18], size: [0.08, 0.26, 0.12]}
  - {name: cluster, type: panel, color: screen, target: cluster, size: [0.30, 0.12], back_x: 0.74}
  - {name: center_display, type: panel, color: screen, target: center_display, size: [0.26, 0.16], back_x: 0.74}
  - {name: steering_column, type: cylinder, color: dash, a: [0.44, 0.0, -0.23], b: [0.74, 0.0, -0.37], radius: 0.04}
  - {name: column_shroud, type: box, color: dash, center: [0.68, 0.0, -0.175], size: [0.12, 0.10, 0.06]}
  # ---- mirrors (at the gaze targets) ----
  - {name: mirror_left, type: housing, color: dash, target: left_mirror, size: [0.08, 0.20, 0.13],
     offset: [0.04, 0.0, 0.0], glass: mirror, arm_to: [0.90, 0.50, -0.12]}
  - {name: mirror_right, type: housing, color: dash, target: right_mirror, size: [0.08, 0.20, 0.13],
     offset: [0.04, 0.0, 0.0], glass: mirror, arm_to: [0.90, -1.22, -0.12]}
  - {name: mirror_rearview, type: housing, color: dash, target: rearview_mirror, size: [0.04, 0.26, 0.07],
     offset: [0.03, 0.0, 0.0], glass: mirror, arm_to: [0.45, -0.35, 0.37]}
  # ---- seats ----
  - {name: seat_driver, type: box, color: seat, center: [-0.05, 0.0, -0.72], size: [0.52, 0.52, 0.14]}
  - {name: seatback_driver, type: box, color: seat, center: [-0.33, 0.0, -0.30], size: [0.13, 0.52, 0.78], pitch_deg: 12}
  - {name: seat_passenger, type: box, color: seat, center: [-0.05, -0.72, -0.72], size: [0.52, 0.52, 0.14]}
  - {name: seatback_passenger, type: box, color: seat, center: [-0.33, -0.72, -0.30], size: [0.13, 0.52, 0.78], pitch_deg: 12}
  # ---- the driver's torso, only so the seat belt lies on something (the head comes from configs/cabin.yaml) ----
  - {name: torso, type: box, layer: driver, color: "#8d98aa", center: [-0.14, 0.0, -0.40], size: [0.22, 0.42, 0.50], pitch_deg: 10}
