id: BND-DIS-HEADTURN-ANGLE
number: 19
title: "頭轉 4 s，角度從 ±15° 掃到 ±60°"
title_en: "Head turned for 4 s, angle swept from ±15° to ±60°"
short: "轉頭角度掃描"
short_en: "Head-turn angle sweep"
brief: {all: "轉頭 4 s，左右各 15° / 20° / 30° / 40° / 50° / 60°（12 種）"}
brief_en: {all: "Head turned for 4 s, left and right 15° / 20° / 30° / 40° / 50° / 60°: 12 angles"}
summary: "同一段轉頭換不同角度，兩台相機、左右分開。看轉多大角度開始被當成分心；角度換成框的變化要看相機位置。眼睛跟著頭看過去；±15°、±20° 的視線還在路面範圍內（road_left / road_right 約 ±22°），真值算在路上，±30° 起算離開路面。"
summary_en: "The same head turn at different angles, on two cameras, left and right separately. Checks at what angle a turn starts to count as distraction; how the angle shows up as box changes depends on the camera position. The eyes follow the head; at ±15° and ±20° the gaze is still inside the road area (road_left / road_right are about ±22°), so the ground truth counts it as on road; from ±30° it counts as eyes off road."
status: ready
source: written
tags: [head_turn, angle]
behaviors: [V01]
params:
  yaw_deg: {grid: [-60, -50, -40, -30, -20, -15, 15, 20, 30, 40, 50, 60]}
template:
  cabin:
    targets:                        # 3 m away in the head's direction: the eyes follow the head
      head_-60: [1.500, -2.598, 0.0]
      head_-50: [1.928, -2.298, 0.0]
      head_-40: [2.298, -1.928, 0.0]
      head_-30: [2.598, -1.500, 0.0]
      head_-20: [2.819, -1.026, 0.0]
      head_-15: [2.898, -0.776, 0.0]
      head_15: [2.898, 0.776, 0.0]
      head_20: [2.819, 1.026, 0.0]
      head_30: [2.598, 1.500, 0.0]
      head_40: [2.298, 1.928, 0.0]
      head_50: [1.928, 2.298, 0.0]
      head_60: [1.500, 2.598, 0.0]
  behavior:
    transition_head_s: 0.1
    events:
      on_road_targets: [road_ahead, road_left, road_right, head_15, head_-15, head_20, head_-20]
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: "head_${yaw_deg}", duration: 4.0, head_pose: ["${yaw_deg}", 0, 0]}
    - {target: road_ahead, duration: 3.0}
