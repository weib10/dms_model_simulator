id: BND-SMK-DURATION
title: "菸含在嘴上（手在方向盤）的時間從 0.25 s 掃到 5 s"
summary: "嘴與菸都沒被遮，只改變含菸的時間長短。"
status: ready
source: written
tags: [smoking, duration]
behaviors: [V10]
params:
  smoke_s: {grid: [0.25, 0.5, 1.0, 2.0, 3.0, 5.0]}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${smoke_s}", hand: wheel, cigarette: mouth}
    - {target: road_ahead, duration: 3.0}
