id: BND-DIS-HEADTURN-DURATION
number: 20
title: "頭向右轉 60°，持續時間從 0.5 s 掃到 8 s（3 s 門檻兩側加密）"
summary: "前 10 s 看前方，接著頭向右轉 60° 一段時間，再回正 3 s。頭轉入轉出各 0.1 s，讓轉頭時間接近段長。只用 dash_right：從這台相機看右轉時臉的變化最明顯；角度的影響看 BND-DIS-HEADTURN-ANGLE。
  對照門檻：長分心，連續離開路面 3 s；2.5、2.95、3.0、3.05、3.5 s 夾住門檻（前後各差一幀）。同一個劇本的 15 fps 版是 ROB-DIS-LOW-FPS。"
status: ready
source: written
tags: [head_turn, duration]
behaviors: [V01]
params:
  yaw_deg: {fixed: -60}                # − = 駕駛的右邊
  turn_s: {grid: [0.5, 1.0, 2.0, 2.5, 2.95, 3.0, 3.05, 3.5, 4.0, 5.0, 6.0, 8.0]}
template:
  cabin:
    targets:                        # 3 m away in the head's direction: the eyes follow the head
      head_-60: [1.500, -2.598, 0.0]
  behavior: {transition_head_s: 0.1}
  segments:
    - {target: road_ahead, duration: 10.0}
    - {target: "head_${yaw_deg}", duration: "${turn_s}", head_pose: ["${yaw_deg}", 0, 0]}
    - {target: road_ahead, duration: 3.0}
variation:
  cameras: [dash_right]
