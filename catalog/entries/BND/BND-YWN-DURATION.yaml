id: BND-YWN-DURATION
number: 49
title: "哈欠長度從 2 s 掃到 8 s（含 3 s 附近）"
title_en: "Yawn length swept from 2 s to 8 s (including around 3 s)"
short: "哈欠長度掃描"
short_en: "Yawn length sweep"
brief: {all: "哈欠 2–8 s 共 10 種，含 2.95 / 3.0 / 3.05 s，嘴最大 0.9"}
brief_en: {all: "One yawn of 2–8 s in 10 steps, including 2.95 / 3.0 / 3.05 s, mouth peak 0.9"}
summary: "一次哈欠，嘴最大 0.9，總長由短到長。哈欠用劇本事件（yawn: {start: true}）：嘴照 sin 輪廓張開再閉上，真值 yawning 整段為真。
  嘴超過 0.55（模擬器預設的張嘴門檻）的時間約為總長的 0.6 倍。3 s 附近加密，看哈欠長度的判斷門檻。"
summary_en: "One yawn, mouth peak 0.9, total length from short to long. The yawn uses a scenario event (yawn: {start: true}): the mouth opens and closes along a sine profile, and the ground truth yawning is true for the whole segment. The time the mouth is above 0.55 (the simulator's default mouth-open threshold) is about 0.6 times the total length. Extra steps around 3 s, to probe the yawn-length threshold."
status: ready
source: written
tags: [yawn, duration]
behaviors: [V07]
standards: {STD-A: []}
params:
  yawn_s: {grid: [2.0, 2.5, 2.95, 3.0, 3.05, 3.5, 4.0, 5.0, 6.0, 8.0]}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${yawn_s}", yawn: {start: true, duration_s: "${yawn_s}", peak_openness: 0.9}}
    - {target: road_ahead, duration: 3.0}
