id: BND-DRW-PERCLOS
title: "反覆短閉眼（每次 0.5 s），閉眼比例從 50% 掃到 14%"
summary: "閉眼 0.5 s、睜眼 open_s，重複 6 次；閉眼比例 = 0.5 / (0.5 + open_s)。每次閉眼都很短，只有看「一段時間內閉眼比例」的規則才會有反應。"
status: ready
source: written
tags: [closure, perclos]
behaviors: [V05]
params:
  open_s: {grid: [0.5, 0.75, 1.0, 1.5, 2.0, 3.0]}
template:
  behavior: {blink: {rate_per_min: 2}}
  segments:
    - {target: road_ahead, duration: 7.0}
    - {target: road_ahead, duration: 0.5, eye_openness: 0.05}
    - {target: road_ahead, duration: "${open_s}"}
    - {target: road_ahead, duration: 0.5, eye_openness: 0.05}
    - {target: road_ahead, duration: "${open_s}"}
    - {target: road_ahead, duration: 0.5, eye_openness: 0.05}
    - {target: road_ahead, duration: "${open_s}"}
    - {target: road_ahead, duration: 0.5, eye_openness: 0.05}
    - {target: road_ahead, duration: "${open_s}"}
    - {target: road_ahead, duration: 0.5, eye_openness: 0.05}
    - {target: road_ahead, duration: "${open_s}"}
    - {target: road_ahead, duration: 0.5, eye_openness: 0.05}
    - {target: road_ahead, duration: 4.0}
