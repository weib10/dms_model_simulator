brief: {all: "通話、叼菸、閉眼、沒繫、轉頭；漏框每段約 1 / 5 / 15 / 30 幀，另跑不加漏框版"}
brief_en: {all: "Call, cigarette, closure, unbuckled, head turn; misses in runs of ~1 / 5 / 15 / 30 frames; also none added"}
summary: "和 ROB-ALL-ERROR-PROFILES 同一串行為，再加一段轉頭。low_det 是每幀各自漏（約 1 幀一段），burst_miss_5 / 15 / 30 的漏框率和 low_det 一樣，只是連成平均 5 / 15 / 30 幀一段。"
summary_en: "The same sequence of behaviours as ROB-ALL-ERROR-PROFILES, plus a head turn. low_det misses each frame independently (runs of about 1 frame); burst_miss_5 / 15 / 30 have the same miss rate as low_det, but grouped into runs of 5 / 15 / 30 frames on average."
