title: "睜眼被認成閉眼，每次平均 0.5 s 或 2 s"
summary: "62.5 s 的正常開車（30 s 睜眼、一次真的 2.5 s 閉眼、30 s 睜眼），模擬模型把睜眼報成閉眼：eye_flip_0p5s / eye_flip_2s 約 5% 的幀，
  每次的長度是平均值（0.5 s / 2 s），不是上下限，個別一次可以更短或更長。眨眼和漏框會切斷翻轉，所以這條把眨眼降到每分鐘 2 次。"
