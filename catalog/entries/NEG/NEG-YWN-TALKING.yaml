id: NEG-YWN-TALKING
title: "講話：嘴巴微開（開合度 0.3 / 0.4 / 0.5）持續 5 / 10 / 15 s"
summary: "對照：打哈欠（嘴張到 0.9、持續 3–6 s）與模型的嘴開合判斷門檻（約 0.55）。講話的嘴型，開合度 small 0.3、
  medium 0.4、large 0.5（貼著 0.55 但在下面），持續 5 / 10 / 15 s。只有固定開合，沒有一開一合的動態。"
status: ready
source: written
tags: [talking, mouth]
behaviors: [N15]
params:
  mouth: {levels: {small: 0.3, medium: 0.4, large: 0.5}}
  talk_s: {levels: {small: 5.0, medium: 10.0, large: 15.0}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${talk_s}", mouth_openness: "${mouth}"}
    - {target: road_ahead, duration: 2.0}
