id: NEG-ALL-HAND-OVER-HAND
title: "轉彎交叉換手：手臂掃過方向盤上緣，擋住方向盤柱相機（每次約 0.2 / 0.4 / 0.7 s，2 / 4 / 6 次）"
summary: "對照：漏框、臉不見（不是閉眼、不是分心）。路口左轉：視線在左前路面（仍在路上），右手從左到右掃過方向盤上緣，
  手在正中間時 steering_column 整張臉被擋（偵測不到臉、眼、嘴），在兩側時擋一部分。每次遮擋 = 左 + 中 + 右：
  small 0.05 + 0.1 + 0.05 s、medium 0.1 + 0.2 + 0.1 s、large 0.15 + 0.4 + 0.15 s，共 2 / 4 / 6 次，中間手回方向盤 0.6 s。
  dash_right 看不到這隻手（對照用）。"
status: ready
source: written
tags: [occlusion, hand_over_hand]
behaviors: [N26, N05]
params:
  side_s: {levels: {small: 0.05, medium: 0.1, large: 0.15}}
  center_s: {levels: {small: 0.1, medium: 0.2, large: 0.4}}
  n: {levels: {small: 2, medium: 4, large: 6}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_left,  duration: 0.6}
    - repeat: "${n}"
      segments:
        - {target: road_left, duration: "${side_s}",   hand: wheel_cross_l}
        - {target: road_left, duration: "${center_s}", hand: wheel_cross_c}
        - {target: road_left, duration: "${side_s}",   hand: wheel_cross_r}
        - {target: road_left, duration: 0.6,           hand: wheel}
    - {target: road_ahead, duration: 3.0}
variation:
  cameras: [steering_column, dash_right]
