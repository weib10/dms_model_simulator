id: NEG-YWN-CHEWING
number: 46
title: "嚼口香糖：嘴小幅度規律開合（約 1.4 Hz）"
title_en: "Chewing gum: small, regular mouth opening and closing (about 1.4 Hz)"
short: "嚼口香糖"
short_en: "Chewing gum"
brief: {small: "嘴最大 0.15", medium: "嘴最大 0.2", large: "嘴最大 0.25", all: "嚼 14.5 s，每秒約 1.4 下"}
brief_en: {small: "Mouth peak 0.15", medium: "Mouth peak 0.2", large: "Mouth peak 0.25", all: "Chewing for 14.5 s, about 1.4 times a second"}
summary: "對照：打哈欠、講話。嘴的開合度在 0.05 與 small 0.15、medium 0.2、large 0.25 之間來回，約 1.4 Hz（文獻：咀嚼 1.2–1.8 Hz）：
  張 0.35 s、合 0.35 s、張 0.4 s、合 0.35 s 為一組，10 組共 14.5 s。幅度比講話小、比哈欠小很多。"
summary_en: "Reference: yawning, talking. Mouth openness moves between 0.05 and small 0.15, medium 0.2, large 0.25, at about 1.4 Hz (literature: chewing 1.2–1.8 Hz): open 0.35 s, closed 0.35 s, open 0.4 s, closed 0.35 s make one set, 10 sets for 14.5 s in total. Smaller amplitude than talking, much smaller than a yawn."
status: ready
source: written
tags: [mouth, chewing]
behaviors: [N18]
standards: {STD-A: []}
params:
  peak: {levels: {small: 0.15, medium: 0.2, large: 0.25}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - repeat: 10
      segments:
        - {target: road_ahead, duration: 0.35, mouth_openness: "${peak}"}
        - {target: road_ahead, duration: 0.35, mouth_openness: 0.05}
        - {target: road_ahead, duration: 0.4,  mouth_openness: "${peak}"}
        - {target: road_ahead, duration: 0.35, mouth_openness: 0.05}
    - {target: road_ahead, duration: 3.0}
