id: NEG-SMK-CIG-IN-LAP
title: "菸夾在手上、手放在大腿（沒在抽）：2 / 5 / 10 s"
summary: "對照：抽菸（V10）。有菸，但離臉很遠，沒有在抽；菸拿在手上的時間 small 2 s、medium 5 s、large 10 s，
  越久越像兩口之間的空檔。注意：目前真值把菸在手上算 smoking（configs/behavior.yaml 的 smoking_cigarette_states 含 hand），
  N23 是否算正常還沒決定，所以這條三級的真值都有 smoking。"
status: ready
source: written
tags: [smoking]
behaviors: [N23]
params:
  hold_s: {levels: {small: 2.0, medium: 5.0, large: 10.0}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${hold_s}", hand: lap, cigarette: hand}
    - {target: road_ahead, duration: 3.0}
