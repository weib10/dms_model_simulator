id: NEG-DRW-HAND-AT-EYE
title: "揉眼睛、推眼鏡：右手指節擋住右眼（0.4 / 0.7 / 0.95 s，1 / 2 / 3 次）"
summary: "對照門檻：閉眼約 1 s（眼框不見或變扁）。眼睛其實是睜開的（真值不閉眼），但右眼被手擋住：dash_right、steering_column
  都偵測不到右眼，dash_right 的左眼與臉也會被擋掉一部分（擋多少看 hand_scale）。每次 small 0.4 s、medium 0.7 s、large 0.95 s，
  共 1 / 2 / 3 次，中間 3 s。只看「眼框不見」就判閉眼的後處理會在這裡誤報。"
status: ready
source: written
tags: [hand_near_face, occlusion, rub_eyes]
behaviors: [N13]
params:
  hand_scale: {fixed: 1.0}          # hand size (configs/cabin.yaml driver.hand_scale); --param hand_scale=0.8
  rub_s: {levels: {small: 0.4, medium: 0.7, large: 0.95}}
  n: {levels: {small: 1, medium: 2, large: 3}}
template:
  cabin:
    driver: {hand_scale: "${hand_scale}"}
  segments:
    - {target: road_ahead, duration: 3.0}
    - repeat: "${n}"
      segments:
        - {target: road_ahead, duration: "${rub_s}", hand: at_eye}
        - {target: road_ahead, duration: 3.0}
