id: NEG-SBT-HAND-ACROSS-CHEST
title: "安全帶有繫，手摸耳朵、摸嘴、講電話時擋到一段安全帶（每次 1.5 / 4 / 8 s）"
summary: "對照：沒繫安全帶（V11）的真值沒有時長門檻；後處理通常要安全帶框不見一段時間才報，擋得越久越像沒繫。
  手抬到臉旁時會遮住部分安全帶框，安全帶其實一直繫著。手摸耳朵、摸嘴、講電話（真的有手機）三段各 small 1.5 s、
  medium 4 s、large 8 s，中間放下 2 s。"
status: ready
source: written
tags: [seatbelt, occlusion, hand_near_face]
behaviors: [N29, V08, N20, N21]
params:
  hold_s: {levels: {small: 1.5, medium: 4.0, large: 8.0}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${hold_s}", hand: at_ear}
    - {target: road_ahead, duration: 2.0}
    - {target: road_ahead, duration: "${hold_s}", hand: at_mouth}
    - {target: road_ahead, duration: 2.0}
    - {target: road_ahead, duration: "${hold_s}", hand: call, phone: call}
    - {target: road_ahead, duration: 3.0}
