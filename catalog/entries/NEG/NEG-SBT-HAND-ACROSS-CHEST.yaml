id: NEG-SBT-HAND-ACROSS-CHEST
number: 74
title: "安全帶有繫，右手跨過胸口（抓左肩、整理衣服）擋住一段安全帶（每次 1.5 / 4 / 8 s，2 / 2 / 3 次）"
title_en: "Seat belt buckled, right hand across the chest (holding the left shoulder, adjusting clothes) blocks part of the belt (1.5 / 4 / 8 s each, 2 / 2 / 3 times)"
short: "手跨過胸口擋住安全帶"
short_en: "Hand across the chest hides the belt"
brief: {small: "擋 1.5 s ×2", medium: "擋 4 s ×2", large: "擋 8 s ×3", all: "安全帶其實有繫，每次之間手回方向盤 3 s"}
brief_en: {small: "Blocked 1.5 s ×2", medium: "Blocked 4 s ×2", large: "Blocked 8 s ×3", all: "The belt is actually buckled; hand back on the wheel 3 s between times"}
summary: "對照：沒繫安全帶（V11）。安全帶其實一直繫著，但右手跨到左胸、擋在肩帶前面（手部狀態 chest_left）。
  實測：dash_right 擋住約 1/3 的肩帶、模型偵測到安全帶的幀從約 95% 降到約 60%；overhead_console 擋住約 4 成；steering_column 從下往上看擋不到（對照用）。
  後處理通常要安全帶框不見一段時間才報，擋得越久越像沒繫：每次 small 1.5 s、medium 4 s、large 8 s，共 2 / 2 / 3 次，中間手回方向盤 3 s。
  （原本的版本手抬到臉旁，三台主相機上都擋不到安全帶，2026-11-10 改寫。）"
summary_en: "Reference: unbuckled seat belt (V11). The seat belt is buckled the whole time, but the right hand reaches across to the left side of the chest, in front of the shoulder strap (hand state chest_left). Measured: on dash_right it blocks about 1/3 of the shoulder strap, and the share of frames where the model detects the seat belt drops from about 95% to about 60%; on overhead_console it blocks about 4 in 10; steering_column looks up from below and is not blocked (as a control). Post-processing usually reports only after the seat-belt box has been missing for a while, so the longer the block, the more it looks like an unbuckled belt: each time small 1.5 s, medium 4 s, large 8 s, 2 / 2 / 3 times in total, with the hand back on the wheel for 3 s in between. (In the original version the hand was raised beside the face and blocked the seat belt on none of the three main cameras; rewritten 2026-11-10.)"
status: ready
source: written
tags: [seatbelt, occlusion]
behaviors: [N29]
params:
  hand_scale: {fixed: 1.0}          # hand size (configs/cabin.yaml driver.hand_scale); --param hand_scale=0.8
  hold_s: {levels: {small: 1.5, medium: 4.0, large: 8.0}}
  n: {levels: {small: 2, medium: 2, large: 3}}
template:
  cabin:
    driver: {hand_scale: "${hand_scale}"}
  segments:
    - {target: road_ahead, duration: 3.0}
    - repeat: "${n}"
      segments:
        - {target: road_ahead, duration: "${hold_s}", hand: chest_left}
        - {target: road_ahead, duration: 3.0}
variation:
  cameras: [dash_right, overhead_console, steering_column]
