id: NEG-PHN-HAND-AT-EAR-FP
number: 57
title: "手摸耳朵，模擬模型在手的位置成段報出假手機框（每次 1 / 3 / 6 s，1 / 2 / 3 次）"
summary: "NEG-PHN-HAND-AT-EAR 加上誤報：手在耳邊（沒有手機）時，ctx_fp 讓模擬模型在手的位置成段報出手機框。
  對照：講電話（V08）的真值沒有時長門檻，看的是手機框；假框出現得越久、越多次越像講電話。手在耳邊每次 small 1 s、
  medium 3 s、large 6 s，共 1 / 2 / 3 次，中間放下 3 s。"
status: ready
source: written
tags: [phone, hand_near_face, false_positive]
behaviors: [N20, C03]
params:
  hold_s: {levels: {small: 1.0, medium: 3.0, large: 6.0}}
  n: {levels: {small: 1, medium: 2, large: 3}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - repeat: "${n}"
      segments:
        - {target: road_ahead, duration: "${hold_s}", hand: at_ear, phone: none}
        - {target: road_ahead, duration: 3.0}
variation:
  profiles: [ctx_fp]
