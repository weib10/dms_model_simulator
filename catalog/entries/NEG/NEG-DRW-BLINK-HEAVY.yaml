id: NEG-DRW-BLINK-HEAVY
number: 30
title: "很常眨眼（每分鐘 20 / 30 / 40 次）× 每次 0.15 / 0.25 / 0.3 s"
title_en: "Frequent blinking (20 / 30 / 40 per minute) × 0.15 / 0.25 / 0.3 s each"
short: "頻繁眨眼"
short_en: "Frequent blinking"
brief: {small: "每分鐘 20 次", medium: "每分鐘 30 次", large: "每分鐘 40 次", all: "每級都跑眨眼長度 0.15 / 0.25 / 0.3 s"}
brief_en: {small: "20 per minute", medium: "30 per minute", large: "40 per minute", all: "Each level runs blink lengths 0.15 / 0.25 / 0.3 s"}
summary: "對照：微睡（開合度 < 0.2、約 1 s 以上）與 N10 的上限（連續閉眼 0.5 s）。閉眼類別頻繁出現，但都是眨眼，不是長閉眼。
  兩個維度分開掃：頻率是難度，每分鐘 small 20 次、medium 30 次、large 40 次（文獻：一般 15–17 次、交談時約 26 次）；
  眨眼長度是每一級都跑的 grid：0.15 s（正常，文獻約 0.16 s）、0.25 s（接近睏倦時的約 0.24 s）、0.3 s
  （以 20 fps 輸出是 3 / 5 / 6 幀，其中開合度低於 0.2 的有 1 / 3 / 2 幀，也就是 0.05 / 0.15 / 0.1 s，遠低於 0.5 s；
  0.3 s 的反而比 0.25 s 的短，是因為取樣點剛好落在 0.2 的兩側）。0.4 s 以上的長眨眼本身就是睏倦指標，不放在這條。共 20 s。"
summary_en: "Reference: microsleep (openness < 0.2, about 1 s or more) and the upper limit for N10 (continuous eye closure 0.5 s). The eyes-closed class appears often, but always as blinks, never as a long closure. The two dimensions are swept separately: frequency is the difficulty, small 20, medium 30, large 40 per minute (literature: typically 15–17, about 26 during conversation); blink length is a grid run at every level: 0.15 s (normal, literature about 0.16 s), 0.25 s (close to the roughly 0.24 s seen when drowsy), 0.3 s (at the 20 fps output rate that is 3 / 5 / 6 frames, of which 1 / 3 / 2 frames are below openness 0.2, i.e. 0.05 / 0.15 / 0.1 s, far below 0.5 s; the 0.3 s blink comes out shorter than the 0.25 s one because its samples happen to fall on either side of 0.2). Long blinks of 0.4 s or more are themselves a drowsiness indicator and are not in this entry. 20 s in total."
status: ready
source: written
tags: [blink]
behaviors: [N10]
standards: {STD-A: [R1]}
params:
  rate: {levels: {small: 20, medium: 30, large: 40}}
  blink_s: {grid: [0.15, 0.25, 0.3]}
template:
