id: NEG-DRW-BLINK-HEAVY
number: 30
title: "很常眨眼（每分鐘 20 / 30 / 40 次）× 每次 0.15 / 0.25 / 0.3 s"
summary: "對照：微睡（開合度 < 0.2、約 1 s 以上）與 N10 的上限（連續閉眼 0.5 s）。閉眼類別頻繁出現，但都是眨眼，不是長閉眼。
  兩個維度分開掃：頻率是難度，每分鐘 small 20 次、medium 30 次、large 40 次（文獻：一般 15–17 次、交談時約 26 次）；
  眨眼長度是每一級都跑的 grid：0.15 s（正常，文獻約 0.16 s）、0.25 s（接近睏倦時的約 0.24 s）、0.3 s
  （開合度低於 0.2 的部分約 0.05 / 0.15 / 0.1 s，遠低於 0.5 s）。0.4 s 以上的長眨眼本身就是睏倦指標，不放在這條。共 20 s。"
status: ready
source: written
tags: [blink]
behaviors: [N10]
params:
  rate: {levels: {small: 20, medium: 30, large: 40}}
  blink_s: {grid: [0.15, 0.25, 0.3]}
template:
  behavior: {blink: {rate_per_min: "${rate}", duration_s: "${blink_s}"}}
  segments:
    - {target: road_ahead, duration: 20.0}
