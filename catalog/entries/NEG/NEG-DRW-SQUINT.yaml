id: NEG-DRW-SQUINT
number: 35
title: "瞇眼（陽光或習慣）：開合度 0.5 / 0.35 / 0.25，持續 15 s"
title_en: "Squinting (sunlight or habit): openness 0.5 / 0.35 / 0.25 for 15 s"
short: "瞇眼"
short_en: "Squinting"
brief: {small: "開合度 0.5", medium: "開合度 0.35", large: "開合度 0.25", all: "瞇 15 s，照常眨眼"}
