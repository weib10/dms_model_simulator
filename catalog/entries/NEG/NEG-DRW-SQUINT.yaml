summary: "對照門檻：模擬器的閉眼門檻（開合度 < 0.2）。眼睛是睜開的，只是比較小：開合度 small 0.5、medium 0.35、large 0.25
  （貼著 0.2 但在上面），持續 15 s，期間照常眨眼。"
summary_en: "Reference threshold: the simulator's eye-closure threshold (openness < 0.2). The eyes are open, just narrower: openness small 0.5, medium 0.35, large 0.25 (close to 0.2 but above it), for 15 s, with normal blinking throughout."
