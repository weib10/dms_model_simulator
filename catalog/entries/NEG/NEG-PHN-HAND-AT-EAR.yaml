id: NEG-PHN-HAND-AT-EAR
title: "手摸耳朵或撐頭，沒拿手機（1.5 / 4 / 8 s）"
summary: "對照：講電話（V08）的真值沒有時長門檻，看的是手機框；手貼在耳邊、遮住半邊臉的時間越久越像講電話。
  手在耳邊 small 1.5 s、medium 4 s、large 8 s。手在臉旁只會遮住臉或嘴，這條是遮擋版；有假手機框的版本是 NEG-PHN-HAND-AT-EAR-FP。"
status: ready
source: written
tags: [phone, hand_near_face, occlusion]
behaviors: [N20]
params:
  hold_s: {levels: {small: 1.5, medium: 4.0, large: 8.0}}
template:
  behavior: {events: {phone_hand_states: [phone]}}   # hand: call without a phone is not phone use here
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${hold_s}", hand: call, phone: none}
    - {target: road_ahead, duration: 3.0}
