id: NEG-PHN-HAND-AT-EAR
number: 56
title: "手摸耳朵或撐頭，沒拿手機（1.5 / 4 / 8 s）"
title_en: "Hand touching the ear or propping up the head, no phone (1.5 / 4 / 8 s)"
short: "手摸耳朵，沒拿手機"
short_en: "Hand at the ear, no phone"
brief: {small: "手在耳邊 1.5 s", medium: "手在耳邊 4 s", large: "手在耳邊 8 s"}
brief_en: {small: "Hand at the ear 1.5 s", medium: "Hand at the ear 4 s", large: "Hand at the ear 8 s"}
summary: "對照：講電話（V08）的真值沒有時長門檻，看的是手機框；手貼在耳邊的時間越久越像講電話。
  手在耳邊（hand: at_ear，跟講電話同一個手勢、手裡沒有手機）small 1.5 s、medium 4 s、large 8 s。
  這條有手框、沒有手機框；模擬裡耳邊的手只碰到臉框邊緣，眼睛和嘴都看得到。有假手機框的版本是 NEG-PHN-HAND-AT-EAR-FP。"
summary_en: "Reference: the phone-call (V08) ground truth has no duration threshold; what matters is the phone box; the longer the hand stays against the ear, the more it looks like a phone call. Hand at the ear (hand: at_ear, the same gesture as a phone call, with no phone in the hand) small 1.5 s, medium 4 s, large 8 s. This entry has a hand box and no phone box; in the simulation the hand at the ear only touches the edge of the face box, and the eyes and mouth stay visible. The version with a false phone box is NEG-PHN-HAND-AT-EAR-FP."
status: ready
source: written
tags: [phone, hand_near_face]
behaviors: [N20]
params:
  hold_s: {levels: {small: 1.5, medium: 4.0, large: 8.0}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${hold_s}", hand: at_ear, phone: none}
    - {target: road_ahead, duration: 3.0}
