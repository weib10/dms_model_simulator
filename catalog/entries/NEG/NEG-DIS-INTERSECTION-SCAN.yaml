id: NEG-DIS-INTERSECTION-SCAN
number: 11
title: "路口左右張望：轉頭看左、右橫向路面（約 ±63°）各 0.8 / 1.2 / 2.0 s"
title_en: "Scanning left and right at an intersection: head turns to look at the crossing road on the left and right (about ±63°), 0.8 / 1.2 / 2.0 s each"
short: "路口左右張望"
short_en: "Scanning left and right at an intersection"
brief: {small: "每次 0.8 s", medium: "每次 1.2 s", large: "每次 2.0 s", all: "看左、右、左橫向路面各一次，中間回前方 1 s；算在看路"}
brief_en: {small: "0.8 s each", medium: "1.2 s each", large: "2.0 s each", all: "Looks at the crossing road left, right, left, 1 s ahead in between; counts as on the road"}
summary: "對照門檻：長分心 3 s（只看頭姿或臉框的後處理會把轉頭當分心）。路口張望真的會轉頭 45–80°：這條加了橫向路面目標
  cross_left / cross_right（車前 3 m、左右 6 m，約 ±63°），頭轉約 41°（比真實路口張望常見的 45–80° 小一點），其餘靠眼睛；
  這兩個目標算進 on_road_targets，真值全程在路上，但頭還是轉了不小的角度。
  左、右、左各看一次，每次 small 0.8 s、medium 1.2 s、large 2.0 s（頭轉約 41° 又停留 2 s，只看頭轉角度時最像長分心），
  中間回前方 1 s。"
summary_en: "Reference threshold: long distraction 3 s (post-processing that only looks at head pose or the face box will treat the head turn as distraction). Scanning at an intersection really does turn the head 45–80°: this entry adds crossing-road targets cross_left / cross_right (3 m ahead of the car, 6 m to the left and right, about ±63°); the head turns about 41° (a little less than the 45–80° typical of real intersection scanning), the eyes do the rest. The two targets are counted in on_road_targets, so the ground truth is on road throughout, but the head still turns a fair amount. Look left, right, left once each, each small 0.8 s, medium 1.2 s, large 2.0 s (a head turn of about 41° held for 2 s, the closest to long distraction if only the head-turn angle is used), back to straight ahead for 1 s in between."
status: ready
source: written
tags: [head_turn, intersection]
behaviors: [N05]
params:
  dwell_s: {levels: {small: 0.8, medium: 1.2, large: 2.0}}
template:
  behavior:
    events:
      on_road_targets: [road_ahead, road_left, road_right, cross_left, cross_right]
  cabin:
    targets:                        # cross traffic at the intersection: 3 m ahead, 6 m to the side (about +-63 deg)
      cross_left:  [3.0,  6.0, 0.0]
      cross_right: [3.0, -6.0, 0.0]
  segments:
    - {target: road_ahead,  duration: 3.0}
    - {target: cross_left,  duration: "${dwell_s}"}
    - {target: road_ahead,  duration: 1.0}
    - {target: cross_right, duration: "${dwell_s}"}
    - {target: road_ahead,  duration: 1.0}
    - {target: cross_left,  duration: "${dwell_s}"}
    - {target: road_ahead,  duration: 3.0}
