id: NEG-SMK-HAND-AT-MOUTH-FP
number: 68
title: "手摸嘴或托下巴 1 / 3 / 6 s（1 / 2 / 3 次），模擬模型在嘴前斷續報出假香菸框"
title_en: "Hand touching the mouth or chin in hand for 1 / 3 / 6 s (1 / 2 / 3 times), and the simulated model intermittently reports a false cigarette box in front of the mouth"
short: "手摸嘴，被誤報香菸"
short_en: "Hand at the mouth, mistaken for a cigarette"
brief: {small: "手在嘴前 1 s ×1", medium: "手在嘴前 3 s ×2", large: "手在嘴前 6 s ×3", all: "模擬模型可能在嘴前報出假香菸框（手在嘴前時約三成的幀）；之間放下 3 s"}
brief_en: {small: "Hand at the mouth 1 s ×1", medium: "Hand at the mouth 3 s ×2", large: "Hand at the mouth 6 s ×3", all: "Simulated model may report a false cigarette box (~30% of hand-at-mouth frames); hand down 3 s between"}
summary: "NEG-SMK-HAND-AT-MOUTH 加上誤報：手在嘴邊（沒有菸）時，ctx_fp 讓模擬模型在嘴前成段報出香菸框。
  對照：抽菸（V10）的真值沒有時長門檻，看的是香菸框；假框出現得越久、越多次（像一口一口抽）越像抽菸。
  手在嘴邊每次 small 1 s、medium 3 s、large 6 s，共 1 / 2 / 3 次，中間放下 3 s。
  假框只出現在手在嘴邊的一部分時間（約三成），small 只有 1 s，某些模型雜訊 seed（如 seed 0）在 small 一幀假框都沒有。"
summary_en: "NEG-SMK-HAND-AT-MOUTH plus false positives: when the hand is at the mouth (no cigarette), ctx_fp makes the simulated model report a cigarette box in front of the mouth in stretches. Reference: the smoking (V10) ground truth has no duration threshold; what matters is the cigarette box; the longer and the more often the false box appears (like taking puff after puff), the more it looks like smoking. Hand at the mouth each time small 1 s, medium 3 s, large 6 s, 1 / 2 / 3 times in total, hand down for 3 s in between. The false box covers only part of the hand-at-mouth time (about 30%); small lasts only 1 s, and with some model-noise seeds (e.g. seed 0) small shows no false box at all."
status: ready
source: written
tags: [smoking, hand_near_face, false_positive]
behaviors: [N21, C03]
params:
  hold_s: {levels: {small: 1.0, medium: 3.0, large: 6.0}}
  n: {levels: {small: 1, medium: 2, large: 3}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - repeat: "${n}"
      segments:
        - {target: road_ahead, duration: "${hold_s}", hand: at_mouth, cigarette: none}
        - {target: road_ahead, duration: 3.0}
variation:
  profiles: [ctx_fp]
