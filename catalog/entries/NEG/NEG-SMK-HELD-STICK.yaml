id: NEG-SMK-HELD-STICK
title: "嘴裡叼東西（沒用手扶）：棒棒糖 / 牙籤 / 吸管（3 / 6 / 10 s）"
summary: "對照：抽菸（嘴邊一根約 8 cm、直徑 9 mm 的細長物）。叼著的東西越來越像菸：small 棒棒糖的細棍、medium 牙籤、large 吸管（直徑、長度最接近菸），
  時間 3 / 6 / 10 s，手在方向盤上，真值 smoking 全程為否。profile ctx_fp 打開情境誤報：吸管、筆有較高機率被報成菸框，
  牙籤、棒棒糖較低（configs/emulator.yaml 的 stick_in_mouth_as_cigarette）。"
status: ready
source: written
tags: [held_object, mouth, false_positive]
behaviors: [N22]
params:
  object: {levels: {small: lollipop, medium: toothpick, large: straw}}
  hold_s: {levels: {small: 3.0, medium: 6.0, large: 10.0}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${hold_s}", held: "${object}"}
    - {target: road_ahead, duration: 3.0}
variation:
  profiles: [nominal, ctx_fp]
