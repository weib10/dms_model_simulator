id: NEG-ALL-LAUGH
number: 82
title: "大笑：嘴約 4 Hz 一開一合、眼睛瞇起、頭微仰，每陣 2.0 / 2.25 / 2.5 s"
title_en: "Laughing: mouth opening and closing at about 4 Hz, eyes narrowed, head tilted slightly back, 2.0 / 2.25 / 2.5 s per bout"
short: "大笑"
short_en: "Laughing"
brief: {small: "每陣 2.0 s，嘴最大 0.5，眼 0.6", medium: "每陣 2.25 s，嘴最大 0.6，眼 0.45", large: "每陣 2.5 s，嘴最大 0.75，眼 0.3", all: "笑 2 陣，中間 3 s；頭微仰 5°"}
brief_en: {small: "2.0 s bouts, mouth peak 0.5, eyes 0.6", medium: "2.25 s bouts, mouth peak 0.6, eyes 0.45", large: "2.5 s bouts, mouth peak 0.75, eyes 0.3", all: "2 bouts, 3 s apart; head tilted back 5°"}
summary: "同時像兩種違規：打哈欠（嘴張大且久，3 s 以上）與閉眼（開合度 < 0.2）。一陣笑是嘴約 4 Hz 的開合（文獻：笑每個音節約 0.11 s、間隔約 0.12 s）：
  張 0.15 s、半合 0.1 s 交替，嘴 small 0.5 / 0.35、medium 0.6 / 0.45、large 0.75 / 0.45（張 / 半合），
  眼睛 0.6 / 0.45 / 0.3（0.25 以下視線輸出會失效），頭往後仰約 5°。每陣 small 2.0 s、medium 2.25 s、large 2.5 s，笑 2 陣，中間 3 s。
  medium、large 的張嘴超過 0.55，模型報張嘴是一段一段的（每次 0.15 s，雜訊把半合也推過 0.55 時會連成約 0.4 s），跟哈欠的差別是一開一合與總長（2.5 s 以內）。"
summary_en: "Looks like two violations at once: yawning (mouth wide open for a long time, 3 s or more) and eye closure (openness < 0.2). A bout of laughter is the mouth opening and closing at about 4 Hz (literature: each laugh syllable about 0.11 s, gap about 0.12 s): open 0.15 s and half-closed 0.1 s alternating, mouth small 0.5 / 0.35, medium 0.6 / 0.45, large 0.75 / 0.45 (open / half-closed), eyes 0.6 / 0.45 / 0.3 (below 0.25 the gaze output fails), head tilted back about 5°. Each bout small 2.0 s, medium 2.25 s, large 2.5 s; 2 bouts, 3 s apart. In medium and large the open mouth exceeds 0.55, and the model reports mouth open in pieces (0.15 s each; when noise also pushes the half-closed phase above 0.55 they join into about 0.4 s); the difference from a yawn is the open-close rhythm and the total length (2.5 s at most)."
status: ready
source: written
tags: [yawn, closure, mouth, squint, laugh]
behaviors: [N17]
params:
  hi: {levels: {small: 0.5, medium: 0.6, large: 0.75}}
  lo: {levels: {small: 0.35, medium: 0.45, large: 0.45}}
  eyes: {levels: {small: 0.6, medium: 0.45, large: 0.3}}
  k: {levels: {small: 8, medium: 9, large: 10}}     # 0.25 s open / half-closed cycles per laugh
template:
  behavior: {transition_head_s: 0.15}              # the 5 deg head tilt is done within the first pulse
  segments:
    - {target: road_ahead, duration: 3.0}
    - repeat: 2
      segments:
        - repeat: "${k}"
          segments:
            - {target: road_ahead, duration: 0.15, mouth_openness: "${hi}", eye_openness: "${eyes}", head_pose: [0, 5, 0]}
            - {target: road_ahead, duration: 0.1,  mouth_openness: "${lo}", eye_openness: "${eyes}", head_pose: [0, 5, 0]}
        - {target: road_ahead, duration: 3.0}
