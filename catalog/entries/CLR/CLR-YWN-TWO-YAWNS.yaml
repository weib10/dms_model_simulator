id: CLR-YWN-TWO-YAWNS
title: "兩次哈欠，間隔 12 / 10 / 5 s"
summary: "嘴張大（開合度 0.9），兩次之間閉嘴。看兩次哈欠是不是各被當成一次。
  對照：哈欠嘴張到約 0.9、持續數秒（一般 3–6 s）。每次哈欠 small 5 s、medium 4 s、large 3 s；中間閉嘴 small 12 s、medium 10 s、large 5 s（最短，但仍明確分開）。"
status: ready
source: written
tags: [yawn, clear, rearm]
behaviors: [V07]
params:
  yawn_s: {levels: {small: 5.0, medium: 4.0, large: 3.0}}
  gap_s: {levels: {small: 12.0, medium: 10.0, large: 5.0}}
template:
  segments:
    - {target: road_ahead, duration: 4.0}
    - {target: road_ahead, duration: "${yawn_s}", mouth_openness: 0.9}
    - {target: road_ahead, duration: "${gap_s}"}
    - {target: road_ahead, duration: "${yawn_s}", mouth_openness: 0.9}
    - {target: road_ahead, duration: 6.0}
variation:
  profiles: [ideal, nominal]
