id: CLR-SMK-REARM
number: 71
title: "叼菸 5 / 4 / 2 s、拿掉 8 / 6 / 3 s、再叼一次"
title_en: "Cigarette in the mouth for 5 / 4 / 2 s, removed for 8 / 6 / 3 s, then in the mouth again"
short: "叼菸、拿掉、再叼"
short_en: "Cigarette in, out, then in again"
brief: {small: "叼 5 s、拿掉 8 s", medium: "叼 4 s、拿掉 6 s", large: "叼 2 s、拿掉 3 s", all: "共叼 2 次"}
brief_en: {small: "5 s in, 8 s out", medium: "4 s in, 6 s out", large: "2 s in, 3 s out", all: "Twice in the mouth"}
summary: "手在方向盤，菸含在嘴上。看菸拿掉後有沒有解除、第二次有沒有再觸發。
  對照：抽菸的真值沒有時長門檻。每次叼菸 small 5 s、medium 4 s、large 2 s；中間拿掉 small 8 s、medium 6 s、large 3 s（最短，但仍明確拿掉）。"
summary_en: "Hands on the wheel, cigarette held in the mouth. Checks whether it clears after the cigarette is removed and whether the second time triggers again. Reference: the smoking ground truth has no duration threshold. Each time in the mouth small 5 s, medium 4 s, large 2 s; removed in between small 8 s, medium 6 s, large 3 s (the shortest, but still clearly removed)."
status: ready
source: written
tags: [smoking, clear, rearm]
behaviors: [V10]
params:
  smoke_s: {levels: {small: 5.0, medium: 4.0, large: 2.0}}
  gap_s: {levels: {small: 8.0, medium: 6.0, large: 3.0}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${smoke_s}", hand: wheel, cigarette: mouth}
    - {target: road_ahead, duration: "${gap_s}"}
    - {target: road_ahead, duration: "${smoke_s}", hand: wheel, cigarette: mouth}
    - {target: road_ahead, duration: 6.0}
variation:
  profiles: [ideal, nominal]
