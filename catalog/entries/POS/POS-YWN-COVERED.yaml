id: POS-YWN-COVERED
number: 44
title: "用手遮住嘴打哈欠（5 / 4 / 3 s）"
title_en: "Yawning with a hand covering the mouth (5 / 4 / 3 s)"
short: "用手遮嘴打哈欠"
short_en: "Yawning behind a hand"
brief: {small: "哈欠 5 s", medium: "哈欠 4 s", large: "哈欠 3 s", all: "哈欠全程手遮在嘴前，前後各 3 s 手在方向盤"}
brief_en: {small: "5 s yawn", medium: "4 s yawn", large: "3 s yawn", all: "Hand in front of the mouth for the whole yawn; on the wheel for 3 s before and after"}
summary: "違規真的發生，但嘴被手擋住。哈欠用劇本事件（yawn: {start: true}）：嘴照 sin 輪廓張開再閉上，真值 yawning 整段為真。
  對照：哈欠一般 3–10 s（文獻 5.9 ± 1.9 s）。難度 = 多難認出來：small 5 s、medium 4 s、large 3 s，哈欠全程手遮在嘴前，前後各 3 s 手在方向盤。
  dash_right 整段看不到嘴；steering_column 看得到一部分。嘴完全被擋時，後處理認不出哈欠是可以接受的。"
summary_en: "The violation really happens, but the mouth is covered by the hand. The yawn uses a scenario event (yawn: {start: true}): the mouth opens and closes along a sine profile, and the ground truth yawning is true for the whole segment. Reference: a yawn usually lasts 3–10 s (literature 5.9 ± 1.9 s). Difficulty = how hard it is to recognise: small 5 s, medium 4 s, large 3 s, hand in front of the mouth for the whole yawn, on the wheel for 3 s before and after. dash_right cannot see the mouth at all; steering_column can see part of it. When the mouth is fully covered, it is acceptable for post-processing not to recognise the yawn."
status: ready
source: written
tags: [yawn, hand_near_face, occlusion]
behaviors: [V07, N21]
standards: {STD-A: []}
params:
  yawn_s: {levels: {small: 5.0, medium: 4.0, large: 3.0}}
template:
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${yawn_s}", hand: at_mouth, yawn: {start: true, duration_s: "${yawn_s}", peak_openness: 0.9}}
    - {target: road_ahead, duration: 3.0}
