id: POS-DIS-PASSENGER-6S
title: "頭向右轉 60° 看乘客 6 s"
summary: "只用 dash_right。視線目標 passenger 只會讓頭轉約 30°，所以直接給頭姿 −60°。"
status: ready
source: written
tags: [head_turn, passenger]
template:
  behavior: {transition_head_s: 0.1}
  segments:
    - {target: road_ahead, duration: 3.0}
    - {target: passenger,  duration: 6.0, head_pose: [-60, 0, 0]}
    - {target: road_ahead, duration: 3.0}
variation:
  cameras: [dash_right]
