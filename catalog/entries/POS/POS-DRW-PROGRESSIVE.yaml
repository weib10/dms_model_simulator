title: "一路變睏（約 70 s）：眨眼變慢、哈欠、長閉眼、點頭，最後微睡"
summary: "疲勞逐漸加重的濃縮版。哈欠用劇本事件（yawn: {start: true}）：嘴照 sin 輪廓張開再閉上，真值 yawning 整段為真。
  清醒 10 s → 眨眼變慢、第一次哈欠（20 s）→ 開合度 0.6、長閉眼開始出現、第二次哈欠（20 s）→ 開合度 0.4、頭往下 25°、閉眼更頻繁（15 s）
  → 微睡 2 s（頭往下 30°，劇本固定，每個 seed 都有）→ 驚醒回正。視線一直在路上（低頭但眼睛補償），所以沒有離路分心。"
