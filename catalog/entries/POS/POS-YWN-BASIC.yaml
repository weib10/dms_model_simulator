id: POS-YWN-BASIC
title: "基本款：打一次哈欠（嘴張大 5 / 3 / 2.5 s）"
summary: "哈欠的基本款：眼睛正常。
  對照：哈欠嘴張到約 0.9、持續數秒（一般 3–6 s）；模型的嘴開合判斷門檻約 0.55。small 開合度 0.95、5 s；medium 0.9、3 s；large 0.8、2.5 s。"
status: ready
source: written
tags: [basic, yawn]
behaviors: [V07]
params:
  yawn_s: {levels: {small: 5.0, medium: 3.0, large: 2.5}}
  mouth: {levels: {small: 0.95, medium: 0.9, large: 0.8}}
template:
  segments:
    - {target: road_ahead, duration: 4.0}
    - {target: road_ahead, duration: "${yawn_s}", mouth_openness: "${mouth}"}
    - {target: road_ahead, duration: 5.0}
variation:
  profiles: [ideal, nominal]
