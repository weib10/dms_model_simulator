id: POS-YWN-ONLY
number: 45
title: "打哈欠同時瞇眼（6 / 5 / 3.5 s，頂點眼睛 0.5 / 0.4 / 0.3）"
title_en: "Yawning with narrowed eyes (6 / 5 / 3.5 s, eyes at the peak 0.5 / 0.4 / 0.3)"
short: "打哈欠時瞇眼"
short_en: "Yawning with narrowed eyes"
brief: {small: "哈欠 6 s，嘴 0.95，眼瞇到 0.5", medium: "哈欠 5 s，嘴 0.85，眼瞇到 0.4", large: "哈欠 3.5 s，嘴 0.7，眼瞇到 0.3"}
brief_en: {small: "6 s yawn, mouth 0.95, eyes narrow to 0.5", medium: "5 s yawn, mouth 0.85, eyes narrow to 0.4", large: "3.5 s yawn, mouth 0.7, eyes narrow to 0.3"}
summary: "哈欠到頂點時眼睛會瞇起甚至閉上（文獻：頂點時閉眼）。哈欠用劇本事件（yawn: {start: true}）：嘴照 sin 輪廓張開再閉上，真值 yawning 整段為真。
  看閉眼判斷會不會被哈欠牽動：眼睛最瞇時仍在閉眼門檻 0.2 以上，真值不閉眼。
  small 6 s、嘴 0.95、眼 0.5；medium 5 s、0.85、0.4；large 3.5 s、0.7、0.3。"
summary_en: "At the peak of a yawn the eyes narrow or even close (literature: eyes closed at the peak). The yawn uses a scenario event (yawn: {start: true}): the mouth opens and closes along a sine profile, and the ground truth yawning is true for the whole segment. Checks whether the eye-closure judgement gets pulled along by the yawn: at their narrowest the eyes are still above the 0.2 eye-closure threshold, so the ground truth is not eyes closed. small 6 s, mouth 0.95, eyes 0.5; medium 5 s, 0.85, 0.4; large 3.5 s, 0.7, 0.3."
status: ready
source: written
tags: [yawn, squint, interaction]
behaviors: [V07, N11]
standards: {STD-A: []}
params:
  yawn_s: {levels: {small: 6.0, medium: 5.0, large: 3.5}}
  mouth: {levels: {small: 0.95, medium: 0.85, large: 0.7}}
  eyes: {levels: {small: 0.5, medium: 0.4, large: 0.3}}
template:
  segments:
    - {target: road_ahead, duration: 4.0}
    - {target: road_ahead, duration: "${yawn_s}", yawn: {start: true, duration_s: "${yawn_s}", peak_openness: "${mouth}", eye_openness_at_peak: "${eyes}"}}
    - {target: road_ahead, duration: 4.0}
