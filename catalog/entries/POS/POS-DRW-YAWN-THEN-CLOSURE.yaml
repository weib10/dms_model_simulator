id: POS-DRW-YAWN-THEN-CLOSURE
number: 29
title: "先打哈欠，3 s 後閉眼 3 / 2.5 / 1.5 s"
title_en: "A yawn first, then 3 s later eyes closed for 3 / 2.5 / 1.5 s"
short: "先打哈欠再閉眼"
short_en: "A yawn, then eyes closed"
brief: {small: "哈欠 5 s，閉眼 3 s", medium: "哈欠 4 s，閉眼 2.5 s", large: "哈欠 3 s，閉眼 1.5 s", all: "哈欠結束 3 s 後閉眼"}
brief_en: {small: "Yawn 5 s, closed 3 s", medium: "Yawn 4 s, closed 2.5 s", large: "Yawn 3 s, closed 1.5 s", all: "The eyes close 3 s after the yawn ends"}
summary: "哈欠和閉眼接連出現。哈欠用劇本事件（yawn: {start: true}）：嘴照 sin 輪廓張開再閉上，真值 yawning 整段為真。
  對照門檻：哈欠一般 3–10 s；閉眼開合度 < 0.2 約 1 s 以上。small 哈欠 5 s、閉眼 3 s；medium 4 s、2.5 s；large 3 s、1.5 s。"
summary_en: "A yawn and an eye closure one after the other. The yawn uses a scenario event (yawn: {start: true}): the mouth opens and closes along a sine profile, and the ground truth yawning is true for the whole segment. Reference threshold: a yawn usually lasts 3–10 s; eye closure is openness < 0.2 for about 1 s or more. small yawn 5 s, closure 3 s; medium 4 s, 2.5 s; large 3 s, 1.5 s."
status: ready
source: written
tags: [sleepiness, yawn, closure, interaction]
behaviors: [V05, V07]
standards: {STD-A: [R20]}
params:
  yawn_s: {levels: {small: 5.0, medium: 4.0, large: 3.0}}
  close_s: {levels: {small: 3.0, medium: 2.5, large: 1.5}}
template:
  behavior: {blink: {rate_per_min: 6}}
  segments:
    - {target: road_ahead, duration: 7.0}
    - {target: road_ahead, duration: "${yawn_s}", yawn: {start: true, duration_s: "${yawn_s}", peak_openness: 0.9}}
    - {target: road_ahead, duration: 3.0}
    - {target: road_ahead, duration: "${close_s}", eye_openness: 0.05}
    - {target: road_ahead, duration: 6.0}
variation:
  profiles: [ideal, nominal]
